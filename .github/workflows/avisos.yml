name: Avisos del finde

on:
  schedule:
    - cron: '7 8 * * 6'    # sábado ~09:07 en Madrid (invierno) / 10:07 (verano): "este finde te toca…"
    - cron: '17 12 * * 3'  # miércoles: solo despierta a Supabase para que no se pause
  workflow_dispatch:        # botón "Run workflow" para probar a mano
    inputs:
      mode:
        description: 'finde = mandar avisos · ping = solo despertar la BD'
        default: 'finde'

jobs:
  avisos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-save --no-package-lock web-push@3 @supabase/supabase-js@2
      - name: Enviar
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then
            if [ "${{ github.event.schedule }}" = "17 12 * * 3" ]; then MODE=ping; else MODE=finde; fi
          fi
          node scripts/avisos.mjs "$MODE"
